name: Verify source backup

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Verify repository policy and compaction offline
        run: node --test tests/repository.test.mjs extensions/strata-compaction/*.test.mjs
      - name: Parse Windows launchers without running them
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('start_model_qwen.ps1', 'start_web_strata.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "$file has PowerShell syntax errors" }
          }
      - name: Verify Windows launchers with synthetic HTTP servers
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_launchers.py -v
